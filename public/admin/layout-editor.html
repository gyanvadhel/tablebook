<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Floor Plan Studio — TableBook Admin</title>
  <link rel="stylesheet" href="/css/main.css">
  <link rel="stylesheet" href="/css/admin.css">
  <link rel="stylesheet" href="/css/hall-map.css">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='20' fill='%2318181b'/><text x='50' y='65' font-size='50' text-anchor='middle' fill='%23f4f4f5' font-family='sans-serif' font-weight='bold'>T</text></svg>">
</head>
<body class="studio-body">

  <!-- ============ STUDIO TOP BAR ============ -->
  <header class="studio-topbar">
    <div class="studio-topbar-left">
      <a href="/admin/events.html" class="studio-back-btn" title="Back to Exhibitions">&larr;</a>
      <div class="studio-title-group">
        <h1 id="editor-title">Floor Plan Studio</h1>
        <span class="badge studio-dim-badge" id="hall-dimension-badge">Loading...</span>
      </div>
    </div>
    <div class="studio-topbar-center" id="editor-subtitle">Loading layout...</div>
    <div class="studio-topbar-right">
      <div class="studio-zoom-group">
        <button class="studio-icon-btn" onclick="layoutEditor.zoomOut()" title="Zoom Out (-)">&#8722;</button>
        <button class="studio-icon-btn" onclick="layoutEditor.resetView()" title="Fit to Screen">Fit</button>
        <button class="studio-icon-btn" onclick="layoutEditor.zoomIn()" title="Zoom In (+)">+</button>
      </div>
      <select class="studio-select" id="snap-grid-select" onchange="layoutEditor.setSnapGrid(this.value)" title="Snap Grid">
        <option value="1" selected>Snap: 1 ft</option>
        <option value="0.5">Snap: 6 in</option>
        <option value="0.25">Snap: 3 in</option>
        <option value="0">Snap: Off</option>
      </select>
      <div class="studio-separator"></div>
      <div class="dropdown-wrapper" style="position: relative; display: inline-block;">
        <button class="studio-text-btn" onclick="layoutEditor.toggleFloorRotateMenu()" id="rotate-floor-btn" title="Rotate Entire Hall Orientation">
          Rotate Floor
        </button>
        <div id="floor-rotate-menu" class="cad-menu hidden" style="position: absolute; right: 0; top: 110%; z-index: 1050; min-width: 210px;">
          <button type="button" class="menu-item" onclick="layoutEditor.rotateEntireFloor('cw')">
            <span>Rotate 90 Clockwise</span>
            <span class="menu-shortcut">CW</span>
          </button>
          <button type="button" class="menu-item" onclick="layoutEditor.rotateEntireFloor('ccw')">
            <span>Rotate 90 Counter-CW</span>
            <span class="menu-shortcut">CCW</span>
          </button>
          <button type="button" class="menu-item" onclick="layoutEditor.rotateEntireFloor('180')">
            <span>Rotate 180 Inverted</span>
            <span class="menu-shortcut">180</span>
          </button>
        </div>
      </div>
      <button class="studio-save-btn" onclick="layoutEditor.saveLayout()" id="save-layout-btn">Save Floor Plan</button>
    </div>
  </header>

  <!-- ============ 3-COLUMN STUDIO LAYOUT ============ -->
  <div class="studio-layout">

    <!-- ===== LEFT PANEL: PALETTE / TOOLBOX ===== -->
    <aside class="studio-palette" id="studio-palette">

      <!-- Stalls -->
      <div class="palette-section" id="palette-stalls">
        <button class="palette-header" onclick="layoutEditor.togglePaletteSection('stalls')">
          <span class="palette-header-label">Stalls</span>
          <span class="palette-chevron" id="chevron-stalls">&#9662;</span>
        </button>
        <div class="palette-items" id="palette-items-stalls">
          <button class="palette-item" onclick="layoutEditor.addTable('single')" title="Single Table - 4 ft x 2 ft">
            <span class="palette-item-icon">&#9644;</span>
            <span class="palette-item-text">Single <small>4x2</small></span>
          </button>
          <button class="palette-item" onclick="layoutEditor.addTable('double')" title="Double Table - 8 ft x 2 ft">
            <span class="palette-item-icon">&#9644;&#9644;</span>
            <span class="palette-item-text">Double <small>8x2</small></span>
          </button>
          <button class="palette-item" onclick="layoutEditor.addTable('L-Stall')" title="L-Stall Corner - 6 ft x 4 ft">
            <span class="palette-item-icon">&#9494;</span>
            <span class="palette-item-text">L-Stall <small>6x4</small></span>
          </button>
          <button class="palette-item" onclick="layoutEditor.addTable('L-Stall-Inverted')" title="L-Inverted - 6 ft x 4 ft">
            <span class="palette-item-icon">&#9496;</span>
            <span class="palette-item-text">L-Inverted <small>6x4</small></span>
          </button>
          <button class="palette-item" onclick="layoutEditor.addTable('T-Stall')" title="T-Stall - 6 ft x 4 ft">
            <span class="palette-item-icon">&#9524;</span>
            <span class="palette-item-text">T-Stall <small>6x4</small></span>
          </button>
          <button class="palette-item" onclick="layoutEditor.addTable('Pod')" title="Pod Cluster - 8 ft x 4 ft">
            <span class="palette-item-icon">&#9638;</span>
            <span class="palette-item-text">Pod (4-Pack) <small>8x4</small></span>
          </button>
        </div>
      </div>

      <!-- Halls / Rooms -->
      <div class="palette-section" id="palette-halls">
        <button class="palette-header" onclick="layoutEditor.togglePaletteSection('halls')">
          <span class="palette-header-label">Halls / Rooms</span>
          <span class="palette-chevron" id="chevron-halls">&#9662;</span>
        </button>
        <div class="palette-items" id="palette-items-halls">
          <button class="palette-item" onclick="layoutEditor.addHallRoom({ width: 30, height: 20 })" title="Standard Hall - 30 x 20">
            <span class="palette-item-icon">&#9633;</span>
            <span class="palette-item-text">Standard <small>30x20</small></span>
          </button>
          <button class="palette-item" onclick="layoutEditor.addHallRoom({ width: 50, height: 30 })" title="Large Hall - 50 x 30">
            <span class="palette-item-icon">&#9633;</span>
            <span class="palette-item-text">Large Hall <small>50x30</small></span>
          </button>
          <button class="palette-item" onclick="layoutEditor.addHallRoom({ width: 20, height: 15 })" title="Gallery - 20 x 15">
            <span class="palette-item-icon">&#9633;</span>
            <span class="palette-item-text">Gallery <small>20x15</small></span>
          </button>
          <button class="palette-item" onclick="layoutEditor.promptCustomHallRoom()" title="Custom Size Hall">
            <span class="palette-item-icon">+</span>
            <span class="palette-item-text">Custom Hall...</span>
          </button>
        </div>
      </div>

      <!-- Doors -->
      <div class="palette-section" id="palette-doors">
        <button class="palette-header" onclick="layoutEditor.togglePaletteSection('doors')">
          <span class="palette-header-label">Doors / Openings</span>
          <span class="palette-chevron" id="chevron-doors">&#9662;</span>
        </button>
        <div class="palette-items" id="palette-items-doors">
          <button class="palette-item palette-item-entrance" onclick="layoutEditor.addDoor('entrance')" title="Main Entrance">
            <span class="palette-item-text">Main Entrance</span>
          </button>
          <button class="palette-item palette-item-exit" onclick="layoutEditor.addDoor('exit')" title="Emergency Exit">
            <span class="palette-item-text">Emergency Exit</span>
          </button>
          <button class="palette-item" onclick="layoutEditor.addDoor('double')" title="Double Door (6 ft)">
            <span class="palette-item-text">Double Door</span>
          </button>
          <button class="palette-item" onclick="layoutEditor.addDoor('window')" title="Wall Window (6 ft)">
            <span class="palette-item-text">Wall Window</span>
          </button>
        </div>
      </div>

      <!-- Text / Signs -->
      <div class="palette-section" id="palette-text">
        <button class="palette-header" onclick="layoutEditor.togglePaletteSection('text')">
          <span class="palette-header-label">Text / Signs</span>
          <span class="palette-chevron" id="chevron-text">&#9662;</span>
        </button>
        <div class="palette-items" id="palette-items-text">
          <button class="palette-item" onclick="layoutEditor.addTextElement('MAIN ENTRANCE', { badge: true, color: '#059669' })">
            <span class="palette-item-text">Entrance Sign</span>
          </button>
          <button class="palette-item" onclick="layoutEditor.addTextElement('EMERGENCY EXIT', { badge: true, color: '#dc2626' })">
            <span class="palette-item-text">Exit Sign</span>
          </button>
          <button class="palette-item" onclick="layoutEditor.addTextElement('REGISTRATION DESK', { badge: true, color: '#2563eb' })">
            <span class="palette-item-text">Registration</span>
          </button>
          <button class="palette-item" onclick="layoutEditor.addTextElement('FOOD COURT', { badge: true, color: '#d97706' })">
            <span class="palette-item-text">Food Court</span>
          </button>
          <button class="palette-item" onclick="layoutEditor.addTextElement('RESTROOMS', { badge: true, color: '#7c3aed' })">
            <span class="palette-item-text">Restrooms</span>
          </button>
          <button class="palette-item" onclick="layoutEditor.addCustomTextPrompt()" title="Custom Label">
            <span class="palette-item-icon">+</span>
            <span class="palette-item-text">Custom Label...</span>
          </button>
        </div>
      </div>

      <!-- Structures -->
      <div class="palette-section" id="palette-structures">
        <button class="palette-header" onclick="layoutEditor.togglePaletteSection('structures')">
          <span class="palette-header-label">Structures</span>
          <span class="palette-chevron" id="chevron-structures">&#9662;</span>
        </button>
        <div class="palette-items" id="palette-items-structures">
          <button class="palette-item" onclick="layoutEditor.addStructure('pillar_square')" title="Pillar (2x2)">
            <span class="palette-item-icon">&#9632;</span>
            <span class="palette-item-text">Pillar <small>2x2</small></span>
          </button>
          <button class="palette-item" onclick="layoutEditor.addStructure('pillar_round')" title="Column (2 dia)">
            <span class="palette-item-icon">&#9679;</span>
            <span class="palette-item-text">Column <small>2 dia</small></span>
          </button>
          <button class="palette-item" onclick="layoutEditor.addStructure('stage')" title="Stage (16x8)">
            <span class="palette-item-icon">&#9644;</span>
            <span class="palette-item-text">Stage <small>16x8</small></span>
          </button>
          <button class="palette-item" onclick="layoutEditor.addStructure('arrow')" title="Flow Arrow">
            <span class="palette-item-icon">&#10132;</span>
            <span class="palette-item-text">Flow Arrow</span>
          </button>
        </div>
      </div>

      <!-- Shortcuts Footer -->
      <div class="palette-shortcuts">
        <div class="palette-shortcuts-title">Shortcuts</div>
        <div class="palette-shortcuts-grid">
          <span><strong>F</strong> Flip</span>
          <span><strong>R</strong> Rotate</span>
          <span><strong>Shift+D</strong> Clone</span>
          <span><strong>Del</strong> Delete</span>
        </div>
      </div>
    </aside>

    <!-- ===== CENTER: CANVAS ===== -->
    <main class="studio-canvas-area">
      <div class="editor-canvas" id="editor-canvas">
        <svg id="editor-svg" xmlns="http://www.w3.org/2000/svg"></svg>

        <!-- Floating Action Bar -->
        <div id="table-floating-actions" class="cad-floating-bar hidden">
          <div class="cad-bar-tag">Edit</div>
          <div class="cad-bar-items">
            <button type="button" class="cad-btn" onclick="layoutEditor.flipSelected()" title="Flip / Mirror (F)">
              <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="7 2 3 6 7 10"></polyline><polyline points="17 14 21 18 17 22"></polyline><line x1="3" y1="6" x2="21" y2="6"></line><line x1="21" y1="18" x2="3" y2="18"></line></svg>
            </button>
            <button type="button" class="cad-btn" onclick="layoutEditor.rotateSelected()" title="Rotate 90 (R)">
              <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21.5 2v6h-6M21.34 15.57a10 10 0 1 1-.57-8.38l5.67-5.67"/></svg>
            </button>
            <button type="button" class="cad-btn" onclick="layoutEditor.duplicateSelected()" title="Duplicate (Shift+D)">
              <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="9" y="9" width="13" height="13" rx="2" ry="2"></rect><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"></path><line x1="12" y1="15" x2="18" y2="15"></line><line x1="15" y1="12" x2="15" y2="18"></line></svg>
            </button>
            <button type="button" class="cad-btn btn-trash" onclick="layoutEditor.deleteSelected()" title="Delete (Del)">
              <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="3 6 5 6 21 6"></polyline><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path></svg>
            </button>
          </div>
        </div>
      </div>
    </main>

    <!-- ===== RIGHT PANEL: INSPECTOR + DIRECTORY ===== -->
    <aside class="studio-inspector" id="studio-inspector">
      <div class="inspector-panel" id="properties-panel">
        <div class="inspector-panel-header">
          <span id="inspector-header-title">Inspector</span>
          <span class="badge" id="inspector-badge" style="font-size: 0.68rem; display: none;">Stall</span>
        </div>
        <div class="inspector-panel-body" id="properties-body">
          <p class="text-muted" style="font-size: 0.85rem; text-align: center; padding: var(--space-md) 0;">
            Select a stall, door, or label on the floor plan to edit its properties.
          </p>
        </div>
      </div>

      <div class="inspector-panel" style="flex: 1; overflow: hidden; display: flex; flex-direction: column;">
        <div class="inspector-panel-header" style="display: flex; justify-content: space-between; align-items: center;">
          <span>Directory (<span id="total-items-count">0</span>)</span>
          <div class="directory-filter-tabs">
            <button type="button" class="dir-tab active" onclick="layoutEditor.filterDirectory('all')">All</button>
            <button type="button" class="dir-tab" onclick="layoutEditor.filterDirectory('stalls')">Stalls</button>
            <button type="button" class="dir-tab" onclick="layoutEditor.filterDirectory('elements')">Other</button>
          </div>
        </div>
        <div class="inspector-panel-body" style="flex: 1; overflow-y: auto; padding: 6px;" id="table-list">
          <p class="text-muted" style="font-size: 0.85rem; text-align: center;">No items placed yet</p>
        </div>
      </div>
    </aside>
  </div>

  <div class="toast-container" id="toast-container"></div>

  <script src="/js/units.js"></script>
  <script src="/js/admin/auth.js"></script>
  <script src="/js/admin/layout-editor.js"></script>
</body>
</html>
