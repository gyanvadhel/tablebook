<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Manage Reservations — TableBook Admin</title>
  <link rel="stylesheet" href="/css/main.css">
  <link rel="stylesheet" href="/css/admin.css">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='20' fill='%2318181b'/><text x='50' y='65' font-size='50' text-anchor='middle' fill='%23f4f4f5' font-family='sans-serif' font-weight='bold'>T</text></svg>">
</head>
<body>
  <div class="admin-layout">
    <!-- Sidebar -->
    <aside class="admin-sidebar" id="admin-sidebar">
      <a href="/admin/dashboard.html" class="sidebar-brand">
        TableBook
      </a>
      <ul class="sidebar-nav">
        <li><a href="/admin/dashboard.html">Dashboard</a></li>
        <li><a href="/admin/events.html">Exhibitions</a></li>
        <li><a href="/admin/bookings.html" class="active">Reservations</a></li>
      </ul>
      <div class="sidebar-footer">
        <div class="sidebar-user">
          <div class="user-avatar" id="user-avatar">A</div>
          <div class="user-info">
            <div class="user-name" id="user-name">Admin</div>
            <div class="user-role">Administrator</div>
          </div>
        </div>
        <button class="btn btn-secondary btn-sm" style="width: 100%;" onclick="logout()">Log Out</button>
        <a href="/" class="btn btn-secondary btn-sm" style="width: 100%; margin-top: var(--space-xs); text-align: center;">View Website</a>
      </div>
    </aside>

    <!-- Main Content -->
    <main class="admin-main">
      <div class="admin-page-header">
        <h1>Reservations</h1>
        <div class="header-actions">
          <button class="btn btn-secondary" onclick="exportBookings()" id="export-btn">Export CSV</button>
        </div>
      </div>

      <div class="data-table-wrapper">
        <div class="data-table-header">
          <h3>All Reservations</h3>
          <div class="data-table-filters">
            <input type="text" class="form-input" id="search-input" placeholder="Search name, ref, business..." style="min-width: 200px;">
            <select class="form-select" id="filter-event">
              <option value="">All Events</option>
            </select>
            <select class="form-select" id="filter-status">
              <option value="">All Statuses</option>
              <option value="pending">Pending</option>
              <option value="confirmed">Confirmed</option>
              <option value="cancelled">Cancelled</option>
            </select>
          </div>
        </div>

        <table class="data-table">
          <thead>
            <tr>
              <th>Reference</th>
              <th>Exhibitor</th>
              <th>Business Name</th>
              <th>Table</th>
              <th>Event</th>
              <th>Fee</th>
              <th>Status</th>
              <th>Booked Date</th>
              <th>Actions</th>
            </tr>
          </thead>
          <tbody id="bookings-table-body">
            <tr><td colspan="9" class="text-center text-muted" style="padding: var(--space-xl);">Loading...</td></tr>
          </tbody>
        </table>
      </div>
    </main>
  </div>

  <div class="toast-container" id="toast-container"></div>

  <script src="/js/admin/auth.js"></script>
  <script src="/js/admin/bookings.js"></script>
</body>
</html>
