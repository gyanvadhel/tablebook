<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Manage Exhibitions — TableBook Admin</title>
  <link rel="stylesheet" href="/css/main.css">
  <link rel="stylesheet" href="/css/admin.css">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='20' fill='%2318181b'/><text x='50' y='65' font-size='50' text-anchor='middle' fill='%23f4f4f5' font-family='sans-serif' font-weight='bold'>T</text></svg>">
</head>
<body>
  <div class="admin-layout">
    <!-- Sidebar -->
    <aside class="admin-sidebar" id="admin-sidebar">
      <a href="/admin/dashboard.html" class="sidebar-brand">
        TableBook
      </a>
      <ul class="sidebar-nav">
        <li><a href="/admin/dashboard.html">Dashboard</a></li>
        <li><a href="/admin/events.html" class="active">Exhibitions</a></li>
        <li><a href="/admin/bookings.html">Reservations</a></li>
      </ul>
      <div class="sidebar-footer">
        <div class="sidebar-user">
          <div class="user-avatar" id="user-avatar">A</div>
          <div class="user-info">
            <div class="user-name" id="user-name">Admin</div>
            <div class="user-role">Administrator</div>
          </div>
        </div>
        <button class="btn btn-secondary btn-sm" style="width: 100%;" onclick="logout()" id="logout-btn">Log Out</button>
        <a href="/" class="btn btn-secondary btn-sm" style="width: 100%; margin-top: var(--space-xs); text-align: center;">View Website</a>
      </div>
    </aside>

    <!-- Main Content -->
    <main class="admin-main">
      <div class="admin-page-header">
        <h1>Exhibitions</h1>
        <div class="header-actions">
          <button class="btn btn-primary" onclick="openEventModal()" id="new-event-btn">+ Create Event</button>
        </div>
      </div>

      <div class="data-table-wrapper">
        <table class="data-table">
          <thead>
            <tr>
              <th>Event Title</th>
              <th>Venue</th>
              <th>Dates</th>
              <th>Total Tables</th>
              <th>Booked</th>
              <th>Status</th>
              <th>Actions</th>
            </tr>
          </thead>
          <tbody id="events-table-body">
            <tr><td colspan="7" class="text-center text-muted" style="padding: var(--space-xl);">Loading...</td></tr>
          </tbody>
        </table>
      </div>
    </main>
  </div>

  <!-- Event Modal -->
  <div class="modal-overlay" id="event-modal-overlay">
    <div class="modal">
      <div class="modal-header">
        <h2 id="event-modal-title">Create New Event</h2>
        <button class="modal-close" onclick="closeEventModal()">&times;</button>
      </div>

      <form id="event-form">
        <input type="hidden" id="event-id">

        <div class="form-group">
          <label class="form-label" for="event-name">Event Name *</label>
          <input type="text" class="form-input" id="event-name" placeholder="Winter Craft Exhibition 2026" required>
        </div>

        <div class="form-group">
          <label class="form-label" for="event-venue">Venue Location</label>
          <input type="text" class="form-input" id="event-venue" placeholder="Sunrise Community Hall, Sector 21">
        </div>

        <div class="form-group">
          <label class="form-label" for="event-description">Event Description</label>
          <textarea class="form-textarea" id="event-description" placeholder="Brief summary of the exhibition"></textarea>
        </div>

        <div style="display: grid; grid-template-columns: 1fr 1fr; gap: var(--space-md);">
          <div class="form-group">
            <label class="form-label" for="event-start-date">Start Date</label>
            <input type="date" class="form-input" id="event-start-date">
          </div>
          <div class="form-group">
            <label class="form-label" for="event-end-date">End Date</label>
            <input type="date" class="form-input" id="event-end-date">
          </div>
        </div>

        <div class="form-group">
          <label class="form-label">Hall Floor Size</label>
          <div style="display: grid; grid-template-columns: 1fr auto 1fr; gap: var(--space-sm); align-items: center;">
            <div class="input-with-unit">
              <input type="number" class="form-input" id="event-hall-width" value="80" min="10" max="600" step="0.5" aria-label="Hall width in feet" oninput="updateHallAreaHint()">
              <span class="input-unit">ft</span>
            </div>
            <span style="color: var(--text-muted);">&times;</span>
            <div class="input-with-unit">
              <input type="number" class="form-input" id="event-hall-height" value="55" min="10" max="600" step="0.5" aria-label="Hall depth in feet" oninput="updateHallAreaHint()">
              <span class="input-unit">ft</span>
            </div>
          </div>
          <p class="form-hint" id="hall-area-hint">Width &times; depth of the hall floor, measured in feet.</p>
        </div>

        <div class="form-group">
          <label class="form-label" for="event-status">Status</label>
          <select class="form-select" id="event-status">
            <option value="draft">Draft</option>
            <option value="active">Active (Visible to public)</option>
            <option value="completed">Completed</option>
          </select>
        </div>
      </form>

      <div class="modal-footer">
        <button class="btn btn-secondary" onclick="closeEventModal()">Cancel</button>
        <button class="btn btn-primary" onclick="saveEvent()" id="save-event-btn">Save Event</button>
      </div>
    </div>
  </div>

  <div class="toast-container" id="toast-container"></div>

  <script src="/js/units.js"></script>
  <script src="/js/admin/auth.js"></script>
  <script src="/js/admin/events.js"></script>
</body>
</html>
