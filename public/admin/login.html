<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Sign In — TableBook</title>
  <link rel="stylesheet" href="/css/main.css">
  <link rel="stylesheet" href="/css/admin.css">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='20' fill='%2318181b'/><text x='50' y='65' font-size='50' text-anchor='middle' fill='%23f4f4f5' font-family='sans-serif' font-weight='bold'>T</text></svg>">
</head>
<body>
  <div class="login-page">
    <div class="login-container">
      <div class="login-card">
        <div class="login-header">
          <h1>Admin Portal</h1>
          <p>Exhibition Management Authentication</p>
        </div>

        <form id="login-form">
          <div class="form-group">
            <label class="form-label" for="username">Username</label>
            <input type="text" class="form-input" id="username" placeholder="Username" autocomplete="username" required>
          </div>

          <div class="form-group">
            <label class="form-label" for="password">Password</label>
            <input type="password" class="form-input" id="password" placeholder="Password" autocomplete="current-password" required>
          </div>

          <div id="login-error" class="form-error hidden"></div>

          <button type="submit" class="btn btn-primary btn-lg" style="width: 100%; margin-top: var(--space-md);" id="login-btn">
            Sign In
          </button>
        </form>

        <p style="text-align: center; margin-top: var(--space-lg); font-size: 0.8rem;">
          <a href="/" style="color: var(--text-muted);">&larr; Public Site</a>
        </p>
      </div>
    </div>
  </div>

  <script src="/js/admin/auth.js"></script>
</body>
</html>
